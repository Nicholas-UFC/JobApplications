<h2 mat-dialog-title class="confirmacao__titulo">
    <mat-icon color="warn">warning</mat-icon>
    {{ dados.titulo ?? 'Excluir' }}
</h2>

<mat-dialog-content>
    <p>Deseja excluir '{{ dados.nome }}'? Esta ação não pode ser desfeita.</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()">Não</button>
    <button mat-flat-button color="warn" type="button" (click)="confirmar()">Sim</button>
</mat-dialog-actions>
